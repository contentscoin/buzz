name: FMG Desktop Release

# Builds the exact FMG desktop version recorded in .release/fmg-live.json.
# This lane is intentionally separate from the upstream desktop release ledger
# and from the short-lived Windows canary workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the installer to the immutable FMG GitHub prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fmg-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build FMG Windows desktop
    if: github.repository == 'contentscoin/buzz'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Require main
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::FMG releases must run from main; got $SOURCE_REF"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Validate FMG release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./.release/fmg-live.json').desktop.version")
          TAG=$(node -p "require('./.release/fmg-live.json').desktop.tag")
          UPSTREAM_SHA=$(node -p "require('./.release/fmg-live.json').upstream.commit")
          PACKAGE_VERSION=$(node -p "require('./desktop/package.json').version")
          TAURI_VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fmg\.[0-9]+$ ]]; then
            echo "::error::Invalid FMG desktop version: $VERSION"
            exit 1
          fi
          if [[ "$TAG" != "fmg-desktop-v${VERSION}" ]]; then
            echo "::error::FMG release tag does not match version"
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" != "$VERSION" || "$TAURI_VERSION" != "$VERSION" ]]; then
            echo "::error::Desktop manifests do not match FMG release version $VERSION"
            exit 1
          fi
          if ! grep -Fxq "version = \"${VERSION}\"" desktop/src-tauri/Cargo.toml; then
            echo "::error::desktop/src-tauri/Cargo.toml does not match $VERSION"
            exit 1
          fi
          if ! grep -A2 -F 'name = "buzz-desktop"' desktop/src-tauri/Cargo.lock | grep -Fxq "version = \"${VERSION}\""; then
            echo "::error::desktop/src-tauri/Cargo.lock does not match $VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "::error::FMG release is not based on the recorded upstream commit $UPSTREAM_SHA"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Resolve native toolchain identity
        id: native_toolchain
        shell: bash
        run: echo "id=$(scripts/desktop-native-toolchain-id.sh windows)" >> "$GITHUB_OUTPUT"

      - name: Compute exact release cache key
        id: rust_cache_key
        shell: bash
        env:
          NATIVE_TOOLCHAIN_ID: ${{ steps.native_toolchain.outputs.id }}
        run: |
          KEY=$(scripts/desktop-release-cache-key.py \
            --platform "$RUNNER_OS" \
            --target "$TARGET" \
            --features default \
            --native-inputs "$NATIVE_TOOLCHAIN_ID")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore exact release Cargo cache
        id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: ${{ steps.rust_cache_key.outputs.key }}

      - name: Generate non-updating bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.fmg.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build Windows NSIS installer
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.fmg.conf.json

      - name: Stage installer and release receipt
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle/nsis"
          EXE=$(find "$BUNDLE_DIR" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR"
            exit 1
          fi
          mkdir -p dist
          OUTPUT="dist/FMG-Buzz_${VERSION}_x64-setup.exe"
          cp "$EXE" "$OUTPUT"
          INSTALLER_SHA256=$(node --input-type=module -e "import {createHash} from 'node:crypto'; import {readFileSync} from 'node:fs'; process.stdout.write(createHash('sha256').update(readFileSync(process.argv[1])).digest('hex'))" "$OUTPUT")
          node --input-type=module - "$OUTPUT" "$INSTALLER_SHA256" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const config = JSON.parse(readFileSync(".release/fmg-live.json", "utf8"));
          const [installer, installerSha256] = process.argv.slice(2);
          writeFileSync("dist/fmg-release-receipt.json", `${JSON.stringify({
            schema: 1,
            ...config,
            source: {
              repository: process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              workflow_run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            },
            installer: {
              file: installer.split("/").at(-1),
              sha256: installerSha256,
            },
          }, null, 2)}\n`);
          NODE
          echo "installer=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "installer_sha256=$INSTALLER_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload FMG release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fmg-buzz-windows-${{ steps.release.outputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.installer }}
            dist/fmg-release-receipt.json
            .release/fmg-live.json
            FMG_CHANGELOG.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable FMG GitHub prerelease
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          INSTALLER: ${{ steps.artifact.outputs.installer }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            TARGET=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)
            if [[ "$TARGET" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing release $TAG targets $TARGET, not $GITHUB_SHA"
              exit 1
            fi
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "FMG Buzz ${VERSION}" \
              --notes-file FMG_CHANGELOG.md \
              --prerelease \
              --latest=false
          fi
          gh release upload "$TAG" \
            "$INSTALLER" \
            dist/fmg-release-receipt.json \
            .release/fmg-live.json \
            --clobber

      - name: Release summary
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_SHA256: ${{ steps.artifact.outputs.installer_sha256 }}
        run: |
          {
            echo "### FMG Buzz ${VERSION}"
            echo
            echo "Source: \`${GITHUB_SHA}\`"
            echo
            echo "Installer SHA-256: \`${INSTALLER_SHA256}\`"
            echo
            echo "Published: \`${{ inputs.publish }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save release Cargo cache
        if: steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: ${{ steps.rust_cache_key.outputs.key }}

      - name: Save pnpm store cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
