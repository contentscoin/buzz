# CI pulls the fork-owned published image; only minio-image.yml builds it.
# MINIO_CI_IMAGE lets the publisher smoke-test an unpublished image or an
# operator reproduce a run with its recorded run-specific tag/digest.
services:
  minio:
    image: ${MINIO_CI_IMAGE:-ghcr.io/contentscoin/buzz-minio:latest}
    platform: linux/amd64
    pull_policy: always
  minio-init:
    image: ${MINIO_CI_IMAGE:-ghcr.io/contentscoin/buzz-minio:latest}
    platform: linux/amd64
    pull_policy: always
